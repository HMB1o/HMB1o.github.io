<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hussam Bajwa | Portfolio</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        /* Light Green Palette */
        :root {
            --light-green: #f0fdf4;    /* Very light background */
            --soft-mint: #dcfce7;      /* Button background */
            --accent-green: #22c55e;   /* Main brand color */
            --dark-forest: #166534;    /* Heading and text color */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-green);
            color: #334155;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        nav {
            background-color: white;
            width: 100%;
            /* Increased the top padding to move the buttons lower on the page */
            padding: 3rem 0 1.5rem 0; 
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        button {
            background-color: var(--soft-mint);
            border: 2px solid var(--accent-green);
            color: var(--dark-forest);
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-green);
            color: white;
            transform: translateY(-2px);
        }

        main {
            width: 90%;
            max-width: 800px;
            margin-top: 40px;
