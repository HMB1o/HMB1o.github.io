<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hussam B | Portfolio</title>
    
    <style>
        /* Light Green Palette */
        :root {
            --light-green: #f0fdf4;
            --soft-mint: #dcfce7;
            --accent-green: #22c55e;
            --dark-forest: #166534;
            --text-dark: #334155;
            --light-gray: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-green);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            background-color: white;
            width: 100%;
            padding: 2rem 0; 
            display: flex;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        button {
            background-color: var(--soft-mint);
            border: 2px solid var(--accent-green);
            color: var(--dark-forest);
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-green);
            color: white;
            transform: translateY(-2px);
        }

        /* Main Container */
        main {
            width: 90%;
            max-width: 1000px;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        /* Section Toggling */
        .page-section {
            display: none; /* Hidden by default, JS will reveal them */
            animation: fadeIn 0.4s ease-in;
        }

        .active-section {
            display: grid; /* The active section uses grid */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* About Me Layout */
        #about-section {
            grid-template-columns: 2fr 1fr; 
            gap: 40px; 
        }

        /* Resume Layout */
        #resume-section {
            grid-template-columns: 1fr;
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border-top: 5px solid var(--accent-green);
        }

        .resume-header {
            text-align: center;
            border-bottom: 2px solid var(--soft-mint);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .resume-header h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        .resume-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
        }

        .resume-item {
            margin-bottom: 25px;
        }

        .resume-item h3 {
            margin: 0;
            color: var(--dark-forest);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
